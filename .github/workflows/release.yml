name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'build.rs'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - os: macos-14
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_flags: '-C target-feature=+crt-static'
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            rust_flags: '-C target-feature=+crt-static'
          - os: ubuntu-latest
            target: x86_64-unknown-freebsd
            toolchain_target: x86_64-unknown-freebsd@14
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify release version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          VERSION=$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml)
          test "$GITHUB_REF_NAME" = "v$VERSION"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation toolchain
        if: runner.os == 'Linux'
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.toolchain_target || matrix.target }}

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        env:
          RUSTFLAGS: ${{ matrix.rust_flags || '' }}
        run: cargo build --locked --release --bin qmacp --target ${{ matrix.target }}

      - name: Package archive (Linux, macOS and FreeBSD)
        if: runner.os != 'Windows'
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          PKG="qmacp-${RELEASE_REF//\//-}-${TARGET}"
          STAGING="dist/${PKG}"
          mkdir -p "$STAGING"
          cp "target/${TARGET}/release/qmacp" README.md LICENSE "$STAGING/"
          tar -czf "dist/${PKG}.tar.gz" -C dist "$PKG"
          echo "ASSET_PATH=dist/${PKG}.tar.gz" >> "$GITHUB_ENV"

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          $PKG = "qmacp-$($env:RELEASE_REF.Replace('/', '-'))-$($env:TARGET)"
          $STAGING = Join-Path 'dist' $PKG
          New-Item -ItemType Directory -Force -Path $STAGING | Out-Null
          Copy-Item "target/$($env:TARGET)/release/qmacp.exe" -Destination $STAGING
          Copy-Item README.md, LICENSE -Destination $STAGING
          $ZIP_PATH = "dist/${PKG}.zip"
          Compress-Archive -Path (Join-Path $STAGING '*') -DestinationPath $ZIP_PATH -Force
          "ASSET_PATH=${ZIP_PATH}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qmacp-${{ matrix.target }}
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error

  release:
    name: GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: 'qmacp-*'
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
