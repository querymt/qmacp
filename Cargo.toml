[package]
name = "qmacp"
description = "CLI for controlling a running QueryMT ACP WebSocket server."
authors = ["Ivan Zatevakhin <ivan@query.mt>"]
repository = "https://github.com/querymt/qmacp"
homepage = "https://query.mt"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "qmacp"
path = "src/main.rs"

[dependencies]
agent-client-protocol = { version = "1.0", features = ["unstable"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.29"
url = "2"
uuid = { version = "1", features = ["v4"] }
